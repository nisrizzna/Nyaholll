<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COBA CAHOL - NYAHOLLL!!!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: sans-serif;
            background-image: url('public/images/background.webp');
            background-size: cover; background-attachment: fixed;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px;
        }
        .container {
            background: #fff; border: 4px solid #000; border-radius: 30px;
            padding: 20px; max-width: 500px; width: 100%;
            text-align: center; box-shadow: 10px 10px 0px #000;
        }
        h1 { font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
        
        .canvas-wrapper {
            width: 100%; aspect-ratio: 1/1; 
            border: 3px solid #000; border-radius: 20px; 
            overflow: hidden; margin-bottom: 20px; background: #eee;
            position: relative;
        }
        canvas { width: 100%; height: 100%; object-fit: contain; }

        .controls { display: flex; flex-direction: column; gap: 10px; }
        button, label.btn {
            background: #fff; border: 3px solid #000; padding: 12px;
            font-weight: bold; border-radius: 50px; cursor: pointer;
            text-transform: uppercase; display: block; width: 100%;
        }
        button:hover, label.btn:hover { background: #000; color: #fff; }
        .btn-main { background: #ffcc00; }
        .btn-main:hover { background: #ffe666; color: #000; }
    </style>
</head>
<body>

    <div class="container">
        <h1>COBA CAHOLNYA</h1>
        <div class="canvas-wrapper">
            <canvas id="caholCanvas"></canvas>
        </div>
        <div class="controls">
            <label for="upload" class="btn btn-main">1. UPLOAD FOTO KAMU</label>
            <input type="file" id="upload" accept="image/*" style="display:none">
            <button onclick="switchSide()">2. PUTAR SISI (DEPAN/BELAKANG)</button>
            <button onclick="window.close()" style="margin-top:20px; border-style:dashed;">TUTUP</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode'); // 'mix' or null (standard)
        
        // State
        let currentSide = 'depan';
        let userImage = null;
        let frameImage = new Image();
        
        // Image Sources
        let frontSrc = "";
        let backSrc = "";

        // Setup Source based on mode
        if (mode === 'mix') {
            frontSrc = params.get('frontSrc');
            backSrc = params.get('backSrc');
        } else {
            const folderName = params.get('folder');
            const category = params.get('cat');
            if (folderName && category) {
                frontSrc = `public/images/${category}/${folderName}/${folderName}_depan.png`;
                backSrc = `public/images/${category}/${folderName}/${folderName}_belakang.png`;
            } else {
                alert("Data produk tidak lengkap!");
            }
        }

        const canvas = document.getElementById('caholCanvas');
        const ctx = canvas.getContext('2d');
        
        loadFrame();

        function loadFrame() {
            const src = (currentSide === 'depan') ? frontSrc : backSrc;
            
            frameImage.src = src;
            frameImage.onload = () => {
                canvas.width = frameImage.width;
                canvas.height = frameImage.height;
                render();
            };
            frameImage.onerror = () => {
                // Silent error
            };
        }

        function switchSide() {
            currentSide = (currentSide === 'depan') ? 'belakang' : 'depan';
            loadFrame();
        }

        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    userImage = new Image();
                    userImage.onload = render;
                    userImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (userImage) {
                ctx.drawImage(userImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#ddd"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#999"; ctx.font = "bold 40px sans-serif";
                ctx.textAlign = "center"; ctx.fillText("FOTO KAMU DISINI", canvas.width/2, canvas.height/2);
            }
            ctx.drawImage(frameImage, 0, 0);
            drawWatermark();
        }

        function drawWatermark() {
            ctx.save();
            ctx.rotate(-15 * Math.PI / 180);
            // REVISI: Ukuran font disesuaikan dan OPACITY DITIPISKAN jadi 0.1
            const fontSize = canvas.width / 10; 
            ctx.font = `900 ${fontSize}px sans-serif`;
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)"; // TIPIS (0.1)
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const loopX = canvas.width * 2;
            const loopY = canvas.height * 2;
            // LOGIK SPAM / TILING
            for (let y = -loopY; y < loopY; y += fontSize * 1.5) {
                for (let x = -loopX; x < loopX; x += ctx.measureText("NYAHOLLL PROPERTY").width + 50) {
                    ctx.fillText("NYAHOLLL PROPERTY", x, y);
                }
            }
            ctx.restore();
        }
    </script>
</body>
</html>
